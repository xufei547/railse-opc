name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # goreleaser 要完整历史与 tag 才能生成 changelog
          fetch-depth: 0
      # 不按 go.mod 的 go 1.26.0 精确装：正式二进制（含直出 TLS 的 hub）要带上 1.26 系列最新补丁版的安全修复。
      # go.mod 只表示最低版本，CI（ci.yml）仍按它测。
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          check-latest: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          # 与 Makefile 的 GORELEASER_VERSION 一致，升级时一起改
          version: v2.19.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
