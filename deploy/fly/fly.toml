# Railse hub 的 Fly.io 配置。部署：fly deploy --config deploy/fly/fly.toml --ha=false
# 首次：fly apps create <名字> --org <组织>；fly volumes create railse_hub --region <区域> --size 1 -a <名字>；
#       fly secrets set RAILSE_HUB_INIT_PASSWORD='<网页密码>' -a <名字>
app = "railse-hub"
primary_region = "nrt"

[build]
  dockerfile = "Dockerfile"
  [build.args]
    RAILSE_VERSION = "0.1.2"

[env]
  RAILSE_HUB_HOME = "/data"
  RAILSE_PUBLIC_URL = "https://railse-hub.fly.dev"

[mounts]
  source = "railse_hub"
  destination = "/data"

# 长连接与推送要求机器常驻：不自动停机，至少一台在跑
[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  [http_service.concurrency]
    type = "connections"
    hard_limit = 200
    soft_limit = 100

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
